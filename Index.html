<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKT PSM — Content OS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0F6E56', 700: '#085041', 900: '#134e4a' },
                        amber: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
                        rose: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48' },
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F8FAFC; color: #0F172A; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* View Transitions */
        .view-section { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .view-section.active { display: block; opacity: 1; animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Utilities */
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #E2E8F0; }
        .card { @apply bg-white rounded-2xl border border-slate-200 shadow-soft; }
        .badge { @apply px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide inline-flex items-center gap-1; }
        
        /* Kanban specific */
        .kanban-col { min-width: 300px; max-width: 300px; }
        .task-card { @apply bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm transition-all hover:shadow-md hover:border-brand-500 cursor-pointer relative overflow-hidden group; }
        .task-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; }
        .task-card.late::before { background-color: #e11d48; } /* Rose 600 */
        .task-card.soon::before { background-color: #f59e0b; } /* Amber 500 */
        .task-card.on-track::before { background-color: #cbd5e1; } /* Slate 300 */
        .task-card.mine { @apply ring-1 ring-brand-500 bg-brand-50/30; }

        /* Calendar specific */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #E2E8F0; border-radius: 0.75rem; overflow: hidden; border: 1px solid #E2E8F0; }
        .cal-cell { background: #fff; min-height: 120px; padding: 0.5rem; }
        .cal-cell.empty { background: #F8FAFC; }
        .cal-cell.today { background: #f0fdfa; box-shadow: inset 0 0 0 2px #0F6E56; }
    </style>
</head>
<body class="flex h-screen antialiased text-sm">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-20 flex-shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="flex items-center gap-2 text-brand-600 font-extrabold text-xl tracking-tight">
                <i class="ph-fill ph-infinity text-2xl"></i> Content OS
            </div>
        </div>

        <!-- Navigation -->
        <div class="p-4 flex-1 overflow-y-auto space-y-6">
            <div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-3">Workspace</div>
                <nav class="space-y-1" id="nav-main">
                    <!-- JS Generated -->
                </nav>
            </div>
            
            <div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-3">Management</div>
                <nav class="space-y-1" id="nav-manager">
                    <!-- JS Generated -->
                </nav>
            </div>
        </div>

        <!-- User Simulator (For Demo) -->
        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <div class="flex items-center gap-3 mb-3 px-1">
                <div id="user-avatar" class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-xs shadow-sm"></div>
                <div class="flex-1 min-w-0">
                    <div id="user-name-display" class="text-sm font-bold text-slate-800 truncate"></div>
                    <div id="user-role-display" class="text-[10px] text-slate-500 truncate"></div>
                </div>
            </div>
            <div class="text-[9px] text-slate-400 font-bold mb-1 uppercase tracking-wider">Simulasi Akses Google</div>

        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-slate-50">
        
        <!-- Top Header -->
        <header class="h-16 glass-header flex items-center justify-between px-8 z-10 flex-shrink-0">
            <div class="flex items-center gap-3">
                <h1 id="page-title" class="text-lg font-bold text-slate-800">Overview</h1>
                <span id="page-subtitle" class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full hidden sm:block"></span>
            </div>
            
            <div class="flex items-center gap-5">
                <div class="relative hidden md:block">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" placeholder="Cari konten atau campaign..." class="pl-9 pr-4 py-1.5 bg-white border border-slate-200 rounded-full text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 w-64 transition-all outline-none shadow-sm">
                </div>
                
                <!-- Notification Bell -->
                <button class="relative text-slate-400 hover:text-slate-700 transition-colors" onclick="toggleNotifications()">
                    <i class="ph-fill ph-bell text-xl"></i>
                    <span id="notif-badge" class="absolute -top-1 -right-1 h-4 w-4 bg-rose-500 rounded-full border-2 border-white text-[9px] text-white font-bold flex items-center justify-center hidden"></span>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-6 md:p-8 custom-scroll" id="main-content-area">
            
            <!-- VIEW: OVERVIEW -->
            <div id="view-overview" class="view-section active space-y-6 max-w-6xl mx-auto"></div>

            <!-- VIEW: MY TASKS -->
            <div id="view-mytasks" class="view-section space-y-6 max-w-5xl mx-auto"></div>

            <!-- VIEW: BOARD -->
            <div id="view-board" class="view-section h-full flex flex-col"></div>

            <!-- VIEW: CALENDAR -->
            <div id="view-calendar" class="view-section max-w-6xl mx-auto"></div>

            <!-- VIEW: KPI -->
            <div id="view-kpi" class="view-section space-y-6 max-w-6xl mx-auto"></div>
        </div>
    </main>

    <!-- Modals Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeModal(event)">
        
        <!-- Task Detail Modal Engine -->
        <div id="task-modal" class="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-floating transform transition-transform scale-95 duration-300" onclick="event.stopPropagation()">
            <!-- Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-start bg-slate-50/50 rounded-t-2xl shrink-0">
                <div class="flex-1 pr-4">
                    <div class="flex gap-2 items-center mb-2" id="tm-badges"></div>
                    <h2 id="tm-title" class="text-xl font-extrabold text-slate-800 leading-tight"></h2>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 bg-white shadow-sm border border-slate-200 rounded-full p-1.5 transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
            </div>

            <!-- Progress Tracker -->
            <div class="px-6 py-3 border-b border-slate-100 bg-white shrink-0 overflow-x-auto custom-scroll">
                <div class="flex items-center gap-1 min-w-max" id="tm-tracker"></div>
            </div>

            <!-- Body -->
            <div class="p-6 overflow-y-auto custom-scroll flex-1 bg-slate-50/30" id="tm-body">
                <!-- Info Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                        <div class="text-[10px] text-slate-400 font-bold uppercase mb-1">Target Tayang</div>
                        <div id="tm-upload" class="text-sm font-semibold text-slate-800"></div>
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                        <div class="text-[10px] text-slate-400 font-bold uppercase mb-1">Deadline Tahap Ini</div>
                        <div id="tm-sladue" class="text-sm font-semibold"></div>
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm col-span-2 md:col-span-2">
                        <div class="text-[10px] text-slate-400 font-bold uppercase mb-1">PIC Saat Ini</div>
                        <div class="flex items-center gap-2">
                            <div id="tm-pic-avatar" class="w-6 h-6 rounded-full bg-slate-200 text-[10px] font-bold flex items-center justify-center text-slate-600"></div>
                            <div>
                                <div id="tm-pic-name" class="text-sm font-semibold text-slate-800 leading-none"></div>
                                <div id="tm-role" class="text-[10px] text-slate-500 mt-0.5"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Alert Box (Revisi/Notes) -->
                <div id="tm-alert" class="hidden mb-6 rounded-xl p-4 border text-sm font-medium"></div>

                <!-- Content Fields -->
                <div class="space-y-5">
                    <div>
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2"><i class="ph-fill ph-fishing-pole text-brand-500"></i> Hook (3 Detik Pertama)</h4>
                        <div id="tm-hook" class="text-sm text-slate-800 bg-white border border-slate-200 p-3.5 rounded-xl"></div>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2"><i class="ph-fill ph-file-text text-brand-500"></i> Brief / Script</h4>
                        <div id="tm-brief" class="text-sm text-slate-700 bg-white border border-slate-200 p-4 rounded-xl min-h-[80px] leading-relaxed whitespace-pre-wrap"></div>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2"><i class="ph-fill ph-chat-centered-text text-brand-500"></i> Caption & Hashtags</h4>
                        <div id="tm-caption" class="text-sm text-slate-700 bg-white border border-slate-200 p-4 rounded-xl min-h-[60px] leading-relaxed whitespace-pre-wrap"></div>
                    </div>
                </div>
            </div>

            <!-- Action Footer -->
            <div class="px-6 py-4 border-t border-slate-200 bg-white rounded-b-2xl flex justify-between items-center shrink-0">
                <div class="flex gap-3">
                    <button class="text-slate-500 hover:text-brand-600 text-sm font-bold flex items-center gap-1.5 transition-colors bg-slate-100 hover:bg-brand-50 px-3 py-1.5 rounded-lg"><i class="ph-bold ph-link"></i> Link Aset</button>
                    <button class="text-slate-500 hover:text-brand-600 text-sm font-bold flex items-center gap-1.5 transition-colors bg-slate-100 hover:bg-brand-50 px-3 py-1.5 rounded-lg"><i class="ph-bold ph-robot"></i> Tanya AI</button>
                </div>
                <div class="flex gap-2" id="tm-actions">
                    <!-- Dynamic Action Buttons -->
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Panel -->
    <div id="notif-panel" class="fixed top-16 right-8 w-80 bg-white rounded-xl shadow-floating border border-slate-200 z-40 hidden flex-col max-h-[80vh] overflow-hidden transform origin-top-right transition-all">
        <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h3 class="font-bold text-slate-800 text-sm">Notifikasi</h3>
            <button onclick="toggleNotifications()" class="text-slate-400 hover:text-slate-600"><i class="ph-bold ph-x"></i></button>
        </div>
        <div id="notif-list" class="overflow-y-auto p-2 space-y-1 custom-scroll bg-white"></div>
    </div>

    <!-- Message Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg z-50 flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300">
        <i class="ph-fill ph-check-circle text-brand-400 text-xl"></i>
        <span id="toast-msg" class="text-sm font-medium"></span>
    </div>

    <script>
        // --- 1. CORE CONFIGURATION & ARCHITECTURE ---
        // Mirroring backend logic (Apps Script A1_Setup)
        const ROLES = ['Creative Content', 'Copywriter', 'Graphic Design', 'Social Media Specialist', 'SPV Marketing'];
        const STATUSES = ['Idea', 'Brief & Script', 'QC Brief', 'Produksi', 'QC Content', 'Schedule', 'Upload', 'Selesai'];
        
        // State Machine: [Status, OwnerRole, NextStatus, RejectStatus, RejectRole]
        const STATE_MACHINE = [
            ['Idea', 'Creative Content', 'Brief & Script', '', ''],
            ['Brief & Script', 'Copywriter', 'QC Brief', '', ''],
            ['QC Brief', 'SPV Marketing', 'Produksi', 'Brief & Script', 'Copywriter'],
            ['Produksi', '(by format)', 'QC Content', '', ''],
            ['QC Content', 'SPV Marketing', 'Schedule', 'Produksi', '(by format)'],
            ['Schedule', 'Social Media Specialist', 'Upload', '', ''],
            ['Upload', 'Social Media Specialist', 'Selesai', '', ''],
            ['Selesai', '-', '-', '', '']
        ];

        // SLA (Days before deadline)
        const STAGE_SLA = { 'Idea': 10, 'Brief & Script': 8, 'QC Brief': 7, 'Produksi': 5, 'QC Content': 4, 'Schedule': 3, 'Upload': 1 };
        
        // Users Database
        const USERS = [
            { email: 'indra@psm.co.id', nama: 'Indra', role: 'SPV Marketing', capacity: 14 },
            { email: 'talia@psm.co.id', nama: 'Talia', role: 'Copywriter', capacity: 12 },
            { email: 'fakriza@psm.co.id', nama: 'Fakriza', role: 'Graphic Design', capacity: 12 },
            { email: 'faiz@psm.co.id', nama: 'Faiz', role: 'Creative Content', capacity: 12 },
            { email: 'ica@psm.co.id', nama: 'Ica', role: 'Social Media Specialist', capacity: 12 }
        ];

        const TODAY = new Date('2026-08-19T00:00:00'); // Fixed date for consistency based on context

        // Application State
        let STATE = {
            currentUser: USERS[1], // Default: Talia (Copywriter)
            currentView: 'overview',
            tasks: [],
            notifications: []
        };

        const NAV_MAIN = [
            { id: 'overview', icon: 'ph-squares-four', label: 'Overview' },
            { id: 'mytasks', icon: 'ph-target', label: 'Fokus Hari Ini' },
            { id: 'board', icon: 'ph-kanban', label: 'Papan Eksekusi' },
            { id: 'calendar', icon: 'ph-calendar-check', label: 'Kalender Tayang' }
        ];
        
        const NAV_MGR = [
            { id: 'kpi', icon: 'ph-chart-line-up', label: 'KPI & Beban Kerja', roleReq: 'SPV Marketing' }
        ];

        // --- 2. DATA GENERATION (MOCK) ---
        function generateMockTasks() {
            const brands = ['PSM', 'Manajio', 'Life At PSM', 'Romlah'];
            const formats = ['Video', 'Carousel', 'Image'];
            const tasks = [];
            
            // Seed data to ensure dashboard looks populated and realistic
            const baseTasks = [
                { title: 'Insight prioritas kerja leader', status: 'Brief & Script', pic: 'talia@psm.co.id', role: 'Copywriter', offset: 2 },
                { title: 'Tanda leader terlalu micromanage', status: 'Produksi', pic: 'fakriza@psm.co.id', role: 'Graphic Design', offset: -1 },
                { title: 'Perbedaan leader reaktif vs proaktif', status: 'Idea', pic: 'faiz@psm.co.id', role: 'Creative Content', offset: 5 },
                { title: '5 Tanda Rapat Sudah Kehilangan Arah', status: 'QC Brief', pic: 'indra@psm.co.id', role: 'SPV Marketing', offset: 1 },
                { title: 'Meeting Selesai, Summary Udah Nunggu', status: 'QC Content', pic: 'indra@psm.co.id', role: 'SPV Marketing', offset: 0 },
                { title: 'Cara Bikin To-Do List Harian', status: 'Schedule', pic: 'ica@psm.co.id', role: 'Social Media Specialist', offset: 2 }
            ];

            baseTasks.forEach((bt, idx) => {
                let d = new Date(TODAY);
                d.setDate(d.getDate() + bt.offset);
                
                let s = new Date(d); // SLA Due
                s.setDate(d.getDate() - (STAGE_SLA[bt.status] || 0));

                tasks.push({
                    id: `TSK-00${idx+1}`,
                    brand: brands[idx % brands.length],
                    format: formats[idx % formats.length],
                    title: bt.title,
                    status: bt.status,
                    currentRole: bt.role,
                    currentPIC: bt.pic,
                    deadline: d,
                    slaDue: s,
                    upload: d,
                    hook: 'Ini adalah contoh hook yang menarik dalam 3 detik.',
                    brief: 'Detail brief konten menjelaskan poin A, B, dan C. Pastikan tone profesional namun tetap santai.',
                    caption: 'Pernah ngalamin ini? Yuk share di kolom komentar! #MarketingTips',
                    revisiCount: bt.status.includes('QC') ? (Math.random() > 0.5 ? 1 : 0) : 0,
                    lastNote: bt.status.includes('QC') && Math.random() > 0.5 ? 'Tolong perbaiki transisi di detik ke-5.' : ''
                });
            });

            // Generate random backlog
            for(let i=7; i<=30; i++) {
                let statIdx = Math.floor(Math.random() * (STATUSES.length - 1)); // Exclude Selesai mostly
                let status = STATUSES[statIdx];
                let sm = STATE_MACHINE.find(s => s[0] === status);
                let role = sm[1] === '(by format)' ? 'Graphic Design' : sm[1];
                let pic = USERS.find(u => u.role === role)?.email || USERS[0].email;
                
                let offset = Math.floor(Math.random() * 20) - 5; // -5 to +15 days
                let d = new Date(TODAY); d.setDate(d.getDate() + offset);
                let s = new Date(d); s.setDate(d.getDate() - (STAGE_SLA[status] || 0));

                tasks.push({
                    id: `TSK-${String(i).padStart(3, '0')}`,
                    brand: brands[i % brands.length],
                    format: formats[i % formats.length],
                    title: `Ide Konten Kreatif ke-${i} untuk Audiens B2B`,
                    status: status,
                    currentRole: role,
                    currentPIC: pic,
                    deadline: d,
                    slaDue: s,
                    upload: d,
                    hook: 'Tahukah kamu rahasia terbesar bisnis?',
                    brief: 'Standard brief format.',
                    revisiCount: 0
                });
            }
            STATE.tasks = tasks;
        }

        // --- 3. UTILITIES & HELPER FUNCTIONS ---
        const getInitials = (name) => name.charAt(0).toUpperCase();
        const getUserObj = (email) => USERS.find(u => u.email === email) || USERS[0];
        
        const daysDiff = (dateStr) => {
            if(!dateStr) return null;
            const d = new Date(dateStr);
            d.setHours(0,0,0,0);
            return Math.round((d - TODAY) / 86400000);
        };
        
        const formatDate = (dateObj) => {
            if(!dateObj) return '-';
            return dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        };

        const getStatusColor = (status, daysLeft) => {
            if(status === 'Selesai') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
            if(daysLeft < 0) return 'bg-rose-100 text-rose-700 border-rose-200';
            if(status.includes('QC')) return 'bg-amber-100 text-amber-700 border-amber-200';
            return 'bg-slate-100 text-slate-600 border-slate-200';
        };

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        };


        // --- 4. VIEW RENDERING ---

        function renderSidebar() {
            // Update User Selector
            const sel = document.getElementById('user-simulator');
            sel.innerHTML = USERS.map(u => `<option value="${u.email}" ${u.email === STATE.currentUser.email ? 'selected' : ''}>${u.nama} (${u.role})</option>`).join('');
            
            // Update User Profile
            document.getElementById('user-avatar').innerText = getInitials(STATE.currentUser.nama);
            document.getElementById('user-name-display').innerText = STATE.currentUser.nama;
            document.getElementById('user-role-display').innerText = STATE.currentUser.role;

            // Render Nav
            const renderLinks = (links, containerId) => {
                document.getElementById(containerId).innerHTML = links.map(l => {
                    if(l.roleReq && l.roleReq !== STATE.currentUser.role) return ''; // Hide if no permission
                    const isActive = STATE.currentView === l.id;
                    return `
                        <a href="#" onclick="switchView('${l.id}', '${l.label}')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${isActive ? 'bg-brand-50 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent'}">
                            <i class="ph ${isActive ? l.icon.replace('ph-', 'ph-fill ph-') : l.icon} text-lg"></i> ${l.label}
                        </a>
                    `;
                }).join('');
            };
            renderLinks(NAV_MAIN, 'nav-main');
            renderLinks(NAV_MGR, 'nav-manager');
        }

        function switchView(viewId, title) {
            STATE.currentView = viewId;
            document.getElementById('page-title').innerText = title;
            
            // Update UI
            renderSidebar();
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
                if(el.id === `view-${viewId}`) el.classList.add('active');
            });

            // Route to render function
            switch(viewId) {
                case 'overview': renderOverview(); break;
                case 'mytasks': renderMyTasks(); break;
                case 'board': renderBoard(); break;
                case 'calendar': renderCalendar(); break;
                case 'kpi': renderKPI(); break;
            }
        }

        function calculateMetrics() {
            const active = STATE.tasks.filter(t => t.status !== 'Selesai');
            const myActive = active.filter(t => t.currentPIC === STATE.currentUser.email);
            const myOverdue = myActive.filter(t => daysDiff(t.slaDue) < 0).length;
            const spvApprovals = STATE.currentUser.role === 'SPV Marketing' ? active.filter(t => t.status.includes('QC')).length : 0;
            
            // Goal (Target Bulanan)
            const brandTargets = { 'PSM': 24, 'Life At PSM': 10, 'Manajio': 10, 'Romlah': 26 };

                    // Reviewer workflow (SPV)
                    actionsHtml = `
                        <button onclick="rejectTask('${task.id}')" class="bg-white border border-rose-200 text-rose-600 hover:bg-rose-50 text-sm font-bold px-4 py-2 rounded-lg transition-colors shadow-sm">Minta Revisi</button>
                        <button onclick="advanceTask('${task.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-lg shadow-sm transition-colors flex items-center gap-2">Approve & Lanjut <i class="ph-bold ph-check"></i></button>
                    `;
                } else if (!isMine) {
                    // Viewing someone else's task
                    actionsHtml = `<button disabled class="bg-slate-100 text-slate-400 text-sm font-bold px-4 py-2 rounded-lg cursor-not-allowed">Tugas milik ${picObj.nama}</button>`;
                }
            } else {
                actionsHtml = `<span class="text-emerald-600 font-bold text-sm bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100"><i class="ph-bold ph-check-circle"></i> Selesai Dipublish</span>`;
            }

            actionsContainer.innerHTML = actionsHtml;

            // Show Modal
            const overlay = document.getElementById('modal-overlay');
            overlay.classList.remove('hidden');
            // Small delay to allow display block to apply before animating opacity/transform
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                document.getElementById('task-modal').classList.remove('scale-95');
            }, 10);
        }

        function closeModal(e) {
            // Close if clicking outside the modal box
            if(e && e.target.id !== 'modal-overlay') return; 
            
            const overlay = document.getElementById('modal-overlay');
            overlay.classList.add('opacity-0');
            document.getElementById('task-modal').classList.add('scale-95');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        // --- 5. INTERACTIVITY & LOGIC IMPL ---
        
        function advanceTask(id, event) {
            if(event) event.stopPropagation(); // Prevent modal opening if clicked from kanban card
            
            const taskIndex = STATE.tasks.findIndex(t => t.id === id);
            if(taskIndex === -1) return;
            const task = STATE.tasks[taskIndex];
            const sm = STATE_MACHINE.find(s => s[0] === task.status);
            
            if(!sm || sm[2] === '-') return;

            const nextStatus = sm[2];
            const nextSm = STATE_MACHINE.find(s => s[0] === nextStatus);
            
            // Logic to find next PIC based on role
            let nextRole = nextSm[1];
            if(nextRole === '(by format)') {
                nextRole = task.format === 'Video' ? 'Creative Content' : 'Graphic Design';
            }
            
            let nextPIC = USERS.find(u => u.role === nextRole)?.email || USERS[0].email; // Fallback to first user

            // Update Task Object
            STATE.tasks[taskIndex].status = nextStatus;
            STATE.tasks[taskIndex].currentRole = nextRole;
            STATE.tasks[taskIndex].currentPIC = nextPIC;
            STATE.tasks[taskIndex].lastNote = ''; // Clear notes on advance

            // Create Notification
            addNotification(`Tugas <b>${task.title}</b> masuk ke tahap ${nextStatus}.`, nextPIC);

            closeModal();
            showToast(`Task berhasil dipindahkan ke ${nextStatus}`);
            
            // Re-render current view
            switchView(STATE.currentView, document.getElementById('page-title').innerText);
        }

        function rejectTask(id) {
            // Simplified reject logic (simulate prompt for note)
            const note = prompt("Masukkan catatan revisi:", "Perbaiki bagian caption.");
            if(!note) return;

            const taskIndex = STATE.tasks.findIndex(t => t.id === id);
            const task = STATE.tasks[taskIndex];
            const sm = STATE_MACHINE.find(s => s[0] === task.status);
            
            if(!sm || !sm[3]) return; // Cannot reject

            const rejectStatus = sm[3];
            const rejectSm = STATE_MACHINE.find(s => s[0] === rejectStatus);
            
            let rejectRole = rejectSm[1];
            if(rejectRole === '(by format)') rejectRole = task.format === 'Video' ? 'Creative Content' : 'Graphic Design';
            let rejectPIC = USERS.find(u => u.role === rejectRole)?.email;

            STATE.tasks[taskIndex].status = rejectStatus;
            STATE.tasks[taskIndex].currentRole = rejectRole;
            STATE.tasks[taskIndex].currentPIC = rejectPIC;
            STATE.tasks[taskIndex].revisiCount += 1;
            STATE.tasks[taskIndex].lastNote = note;

            addNotification(`Tugas direvisi: ${note}`, rejectPIC);
            
            closeModal();
            showToast('Tugas dikembalikan untuk revisi.');
            switchView(STATE.currentView, document.getElementById('page-title').innerText);
        }

        function toggleNotifications() {
            const panel = document.getElementById('notif-panel');
            panel.classList.toggle('hidden');
            if(!panel.classList.contains('hidden')) {
                renderNotificationList();
                // Clear badge
                document.getElementById('notif-badge').classList.add('hidden');
                document.getElementById('notif-badge').innerText = '';
            }
        }

        function addNotification(msg, toEmail) {
            // In a real app, this goes to DB. Here we simulate it.
            STATE.notifications.unshift({ msg, toEmail, read: false, time: 'Baru saja' });
            updateNotifBadge();
        }

        function updateNotifBadge() {
            const myUnread = STATE.notifications.filter(n => n.toEmail === STATE.currentUser.email && !n.read).length;
            const badge = document.getElementById('notif-badge');
            if(myUnread > 0) {
                badge.innerText = myUnread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderNotificationList() {
            const myNotifs = STATE.notifications.filter(n => n.toEmail === STATE.currentUser.email);
            const list = document.getElementById('notif-list');
            
            if(myNotifs.length === 0) {
                list.innerHTML = `<div class="p-4 text-center text-sm text-slate-500">Tidak ada notifikasi baru.</div>`;
                return;
            }

            list.innerHTML = myNotifs.map(n => `
                <div class="p-3 hover:bg-slate-50 border-b border-slate-50 cursor-pointer">
                    <div class="text-xs text-slate-700 leading-snug">${n.msg}</div>
                    <div class="text-[10px] text-slate-400 mt-1">${n.time}</div>
                </div>
            `).join('');
            
            // Mark as read (simulated)
            myNotifs.forEach(n => n.read = true);
        }

        function renderKPI() {
            // Simple placeholder for KPI view
            document.getElementById('view-kpi').innerHTML = `
                <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm text-center">
                    <div class="w-16 h-16 bg-brand-50 rounded-full flex items-center justify-center text-brand-600 text-3xl mx-auto mb-4"><i class="ph-fill ph-chart-bar"></i></div>
                    <h2 class="text-xl font-bold text-slate-800 mb-2">KPI & Beban Kerja (Dalam Pengembangan)</h2>
                    <p class="text-slate-500 text-sm max-w-md mx-auto">Tampilan ini khusus untuk SPV Marketing untuk melihat kalkulasi beban kerja (Workload Formula) dan performa 4DM secara menyeluruh.</p>
                </div>
            `;
        }

        // --- INIT ---
        window.onload = () => {
            generateMockTasks();
            
            // Setup User Simulator Event
            document.getElementById('user-simulator').addEventListener('change', (e) => {
                STATE.currentUser = USERS.find(u => u.email === e.target.value);
                // When switching users, go back to overview to see role-specific alerts
                switchView('overview', 'Overview');
                updateNotifBadge();
            });

            // Initial Render
            switchView('overview', 'Overview');
        };

    </script>
</body>
</html>
